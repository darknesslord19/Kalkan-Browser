<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Yeni sekme</title>
<style>
  :root {
    --bg: #f6f7fa; --fg: #1c1f26; --muted: #6b7180; --field: #ffffff; --line: #e3e6ec;
    --brand: #f5a524; --glow: rgba(245,165,36,.18); --glow2: rgba(64,170,255,.12);
  }
  :root.dark {
    --bg: #0f1116; --fg: #e8eaf0; --muted: #8c92a0; --field: #1b1e26; --line: #262a34;
    --glow: rgba(245,165,36,.16); --glow2: rgba(80,120,255,.10);
  }
  :root.incognito {
    --bg: #15111f; --fg: #ece8f6; --muted: #9a90b4; --field: #221b33; --line: #2e2545;
    --brand: #a78bfa; --glow: rgba(167,139,250,.20); --glow2: rgba(236,72,153,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Roboto", sans-serif;
    background: var(--bg); color: var(--fg);
    background-image:
      radial-gradient(60vw 40vh at 15% 0%, var(--glow), transparent 70%),
      radial-gradient(60vw 40vh at 100% 20%, var(--glow2), transparent 70%);
    display: flex; flex-direction: column; align-items: center;
    padding: 9vh 18px 28px; min-height: 100%;
  }
  .clock { font-size: 56px; font-weight: 200; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .greet { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-top: 26px; font-weight: 700; letter-spacing: .5px; font-size: 14px; color: var(--muted); }
  .brand svg { width: 18px; height: 18px; }
  form { width: 100%; max-width: 560px; margin-top: 14px; position: relative; }
  input {
    width: 100%; height: 54px; border-radius: 27px; border: 1px solid var(--line);
    background: var(--field); color: var(--fg); font-size: 16px;
    padding: 0 22px 0 50px; outline: none;
    box-shadow: 0 6px 28px rgba(0,0,0,.08);
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--glow); }
  form svg.s { position: absolute; left: 18px; top: 17px; width: 20px; height: 20px; fill: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; width: 100%; max-width: 560px; margin-top: 30px; }
  .site { display: flex; flex-direction: column; align-items: center; gap: 7px; text-decoration: none; color: var(--fg); font-size: 12px; min-width: 0; }
  .site .ic {
    width: 54px; height: 54px; border-radius: 18px; background: var(--field); border: 1px solid var(--line);
    display: grid; place-items: center; overflow: hidden; font-weight: 700; font-size: 20px; color: var(--brand);
    transition: transform .15s;
  }
  .site:active .ic { transform: scale(.92); }
  .site img { width: 28px; height: 28px; }
  .site span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats {
    margin-top: auto; padding-top: 34px; display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 13px; text-align: center;
  }
  .stats b { color: var(--brand); font-size: 15px; }
  .pill { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); }
  .inc { display: none; max-width: 520px; margin-top: 22px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
  :root.incognito .inc { display: block; }
  :root.incognito .grid { display: none; }
  .mask { font-size: 40px; display: none; margin-bottom: 8px; }
  :root.incognito .mask { display: block; }
</style>
</head>
<body>
  <div class="mask"><svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M12,7c2.76,0 5,2.24 5,5 0,0.65 -0.13,1.26 -0.36,1.83l2.92,2.92c1.51,-1.26 2.7,-2.89 3.43,-4.75 -1.73,-4.39 -6,-7.5 -11,-7.5 -1.4,0 -2.74,0.25 -3.98,0.7l2.16,2.16C10.74,7.13 11.35,7 12,7zM2,4.27l2.28,2.28 0.46,0.46C3.08,8.3 1.78,10.02 1,12c1.73,4.39 6,7.5 11,7.5 1.55,0 3.03,-0.3 4.38,-0.84l0.42,0.42L19.73,22 21,20.73 3.27,3 2,4.27z"/></svg></div>
  <div class="clock" id="clock">--:--</div>
  <div class="greet" id="greet"></div>
  <div class="brand">
    <svg viewBox="0 0 24 24"><path fill="#F5A524" d="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4z"/><path fill="#1A1205" d="M10.6,15.6L7,12l1.4,-1.4 2.2,2.2 5,-5L17,9.2z"/></svg>
    KALKAN
  </div>
  <form id="f" autocomplete="off">
    <svg class="s" viewBox="0 0 24 24"><path d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></svg>
    <input id="q" type="search" enterkeyhint="go" placeholder="Ara veya adres yaz">
  </form>
  <div class="inc">Gizli sekmedesin. Ziyaret ettiğin sayfalar geçmişe kaydedilmez ve tüm gizli sekmeler kapanınca çerezler silinir. İnternet sağlayıcın ve ziyaret ettiğin siteler yine de seni görebilir — tam gizlilik için VPN'i aç.</div>
  <div class="grid" id="grid"></div>
  <div class="stats"><div class="pill">Kalkan bugüne kadar <b id="blocked">0</b> reklam ve izleyiciyi engelledi</div></div>

<script>
  var cfg = { engine: 'https://www.google.com/search?q=%s', sites: [], blocked: 0 };
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function tick(){
    var d = new Date(), h = d.getHours();
    document.getElementById('clock').textContent = pad(h) + ':' + pad(d.getMinutes());
    var g = h < 5 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : h < 22 ? 'İyi akşamlar' : 'İyi geceler';
    var days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    document.getElementById('greet').textContent = g + ' · ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + days[d.getDay()];
  }
  tick(); setInterval(tick, 10000);
  if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');

  function isUrl(t){
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return t;
    if (!/\s/.test(t) && /^[^\s.]+(\.[^\s.]+)+(:\d+)?(\/.*)?$/.test(t)) return 'https://' + t;
    return null;
  }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var t = document.getElementById('q').value.trim();
    if (!t) return;
    location.href = isUrl(t) || cfg.engine.replace('%s', encodeURIComponent(t));
  });

  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, '').replace(/^m\./, ''); } catch(e) { return u; } }

  window.kalkanInit = function(c){
    cfg = c;
    var root = document.documentElement;
    root.classList.toggle('dark', !!c.dark);
    root.classList.toggle('incognito', !!c.incognito);
    document.getElementById('q').placeholder = c.engineName + ' ile ara veya adres yaz';
    document.getElementById('blocked').textContent = (c.blocked || 0).toLocaleString('tr-TR');
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    (c.sites || []).forEach(function(s){
      var a = document.createElement('a');
      a.className = 'site'; a.href = s.u;
      var ic = document.createElement('div'); ic.className = 'ic';
      var host = hostOf(s.u);
      var letter = (s.t || host || '?').trim().charAt(0).toUpperCase();
      var img = document.createElement('img');
      img.onerror = function(){ ic.textContent = letter; };
      img.src = 'https://icons.duckduckgo.com/ip3/' + host + '.ico';
      ic.appendChild(img);
      var label = document.createElement('span');
      label.textContent = s.t || host;
      a.appendChild(ic); a.appendChild(label);
      grid.appendChild(a);
    });
  };
</script>
</body>
</html>
